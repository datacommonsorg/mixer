project_id: datcom-apigee
# Values that debug sessions show as *****. Set by deploy_apigee.sh.
debug_mask:
  environment: main
  variables:
    - request.header.authorization
    - request.header.x-api-key
    - request.header.cookie
    - response.header.set-cookie
    - request.queryparam.key
    - request.queryparam.apikey
    # Caller API key and app secret set by verify-api-key-in-header.
    - client_id
    - verifyapikey.verify-api-key-in-header.client_id
    - verifyapikey.verify-api-key-in-header.client_secret
    # Southbound Mixer key set by set-southbound-key.
    - message.queryparam.key
    - message.header.x-api-key
proxies:
  - name: api
    policies:
      - add-cors
      - copy-key-param-to-header
      - verify-api-key-in-header
      - rewrite-missing-key-message
      - rewrite-missing-allow-header-error
      - enforce-quota-limit
      - rewrite-quota-exceeded-message
      - set-southbound-key
      - strip-api-key-header-and-params
      - block-internal-only-endpoints
      - block-deprecated-endpoints
      - set-content-type-to-json
      - extract-json-params
    proxy_endpoints:
      - api
    target_endpoints:
      - api
  - name: nl
    policies:
      - copy-key-param-to-header
      - verify-api-key-in-header
      - strip-api-key-header-and-params
    proxy_endpoints:
      - nl
    target_endpoints:
      - nl
