# This workflow runs in the trusted context of the base repository (master)
# after On PR Trigger finishes. It securely evaluates PR changes and executes
# repository automations (e.g. feature flag checklists, auto-labeling).
#
# SECURITY GUARDRAILS (MUST FOLLOW WHEN ADDING NEW HANDLERS):
# - Never check out or execute untrusted PR code (do not use actions/checkout
#   with the PR head ref or run scripts/binaries from the PR).
# - Never download or trust artifacts from On PR Trigger; always query PR state
#   and changed files directly from the GitHub API using verified workflow_run metadata.
# - Never interpolate untrusted PR metadata (title, body, branch name) directly
#   inside ${{ ... }} in `run:` blocks; handle them inside actions/github-script
#   or pass them through `env:` variables.
# - Keep job permissions scoped to the minimum required (pull-requests: write).
name: On PR Handler

# zizmor: ignore[dangerous-triggers] - {Safe workflow_run usage: no PR code or artifacts are checked out or read.}
on:
  # zizmor: ignore[dangerous-triggers] - {Safe workflow_run usage: no PR code or artifacts are checked out or read.}
  workflow_run:
    workflows: ["On PR Trigger"]
    types: [completed]

permissions: {}

jobs:
  handle:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      # Official GitHub action that runs a Node.js script with a pre-authenticated
      # Octokit REST client (`github`) and workflow event context (`context`).
      # This lets the job query PR files and post comments via api.github.com
      # using the job's scoped GITHUB_TOKEN without checking out repository code.
      - name: Execute PR Automations
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const wfRun = context.payload.workflow_run;
            const headOwner = wfRun.head_repository?.owner?.login;
            const headBranch = wfRun.head_branch;
            const headSha = wfRun.head_sha;

            if (!headOwner || !headBranch || !headSha) {
              core.setFailed('Missing head repository metadata on workflow_run payload.');
              return;
            }

            // * Resolve the open PR matching the exact head branch and commit SHA from GitHub API
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${headOwner}:${headBranch}`,
            });

            const pr = prs.find(p => p.head.sha === headSha);
            if (!pr) {
              core.info(`No open PR found matching ${headOwner}:${headBranch} @ ${headSha}.`);
              return;
            }

            const prNumber = pr.number;
            core.info(`Processing PR #${prNumber}`);

            // * Fetch changed files via GitHub REST API with pagination (no checkout required)
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            const changedFilenames = files.map(f => f.filename);
            core.info(`Found ${changedFilenames.length} changed file(s) in PR #${prNumber}`);

            // =========================================================================
            // HANDLER: Production Feature Flag Review Checklist
            // =========================================================================
            const touchesProdFlags = changedFilenames.some(name => name.startsWith('deploy/featureflags/prod'));

            if (touchesProdFlags) {
              core.info('Production feature flags modified. Ensuring checklist comment is present.');

              const checklistBody = [
                '⚠️ **PRODUCTION FEATURE FLAG CHANGE — REVIEW CHECKLIST**',
                '',
                'Please conduct a careful review before merging this production change & coordinate with the oncaller.',
                'Merging this PR will trigger a rolling restart of all Kubernetes pods in production.',
                '',
                '### Things to check before approving:',
                '- [ ] **Staging Validated**: Have these exact flag changes been tested and verified in staging?',
                '- [ ] **Cache Invalidation**: If API responses change, remember to clear the Redis cache after merging.',
                '- [ ] **Time Window**: Ensure updates occur during global working hours; request lead approval for Friday–Sunday updates.',
                '- [ ] **Oncall Communication**: Please additionally announce this update on the oncall thread.',
                '- [ ] **Type Safety**: Verify that flag value types match what the server binary expects.',
              ].join('\n');

              // * Find existing bot checklist comment to maintain idempotency
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              });

              const existingComment = comments.find(c =>
                c.user.type === 'Bot' &&
                c.body.includes('PRODUCTION FEATURE FLAG CHANGE — REVIEW CHECKLIST')
              );

              if (existingComment) {
                core.info(`Checklist comment ID ${existingComment.id} already exists; skipping update to preserve checked boxes.`);
              } else {
                core.info('Creating new checklist comment');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: checklistBody
                });
              }
            } else {
              core.info('No production feature flags modified in this PR.');
            }

            // =========================================================================
            // FUTURE HANDLERS (e.g. labels, greetings, automated triage) CAN BE ADDED HERE
            // =========================================================================
