name: Dependabot Approval
on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3 # zizmor: ignore[unpinned-uses] official GitHub action

      - name: Comment and approve patch or minor updates
        if: |
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "$PR_URL"
          gh pr review $PR_URL --approve -b "Approving pull request because it includes a **patch or minor update**"
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          PR_URL: ${{github.event.pull_request.html_url}}

      - name: Comment and defer for major updates
        if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr comment $PR_URL --body "Not auto-approving this pull request because it includes a **major update**"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
