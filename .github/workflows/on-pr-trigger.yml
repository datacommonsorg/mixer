# This workflow runs unprivileged on all pull requests (including forks).
# Its completion triggers on-pr-handler.yml on the base branch via workflow_run.
name: On PR Trigger

on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger downstream PR handler
        run: echo "Triggered PR handler for commit ${GITHUB_SHA}."
