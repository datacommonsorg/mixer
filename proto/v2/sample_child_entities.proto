syntax = "proto3";

package datacommons.v2;

option go_package = "github.com/datacommonsorg/mixer/internal/proto/v2";

// SampleChildEntitiesRequest asks, for each ancestor, for a sample of the entities of one type contained
// (transitively, via containedInPlace) in it.
message SampleChildEntitiesRequest {
  repeated string ancestors = 1;
  // Class DCID of the child entities, e.g. "County".
  string child_type = 2;
  // Maximum number of child entities to return per ancestor, from 1 to 100.
  int32 limit_per_ancestor = 3;
}

// SampleChildEntitiesResponse holds, for each ancestor, up to limit_per_ancestor child entities of the
// requested type, sampled across all of that ancestor's child entities of the type. The same request
// returns the same sample. Ancestors without child entities of the type are omitted.
message SampleChildEntitiesResponse {
  message ChildEntities {
    repeated string dcids = 1;
  }
  // Keyed by ancestor DCID.
  map<string, ChildEntities> child_entities = 1;
}
