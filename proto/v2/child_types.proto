syntax = "proto3";

package datacommons.v2;

option go_package = "github.com/datacommonsorg/mixer/internal/proto/v2";

// ChildTypesRequest asks for the types of entities contained (transitively, via containedInPlace)
// in each ancestor entity.
message ChildTypesRequest {
  repeated string ancestors = 1;
}

// ChildTypesResponse holds the child entity types found for each requested ancestor. Ancestors
// without known child types are omitted.
message ChildTypesResponse {
  message ChildTypes {
    repeated string types = 1;
  }
  // Keyed by ancestor DCID.
  map<string, ChildTypes> child_types = 1;
}
